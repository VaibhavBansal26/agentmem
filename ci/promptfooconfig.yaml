# Regression check: the Anthropic-SDK agent, reranker on, answering 20 fixed questions it currently gets right.
# Run:  npx promptfoo@latest eval -c ci/promptfooconfig.yaml --max-concurrency 1
# Pass-rate threshold is set by PROMPTFOO_PASS_RATE_THRESHOLD (CI uses 90, i.e. at most 2 of 20 may fail).
# The cases are chosen from questions that already pass, so this detects regressions; it is not an accuracy estimate.
description: agentmem answer regression check
prompts:
  - "{{question}}"
providers:
  - id: file://agent_provider.py
    label: anthropic-agent-reranker-on
tests:
  - description: "dq000 single-hop"
    vars:
      question: "What was the outcome of ticket T-4003?"
      gold: "confirmed data exfiltration; legal notified"
      qtype: "single-hop"
    assert:
      - type: python
        value: file://assert_grade.py
  - description: "dq001 single-hop"
    vars:
      question: "What was the outcome of ticket T-4011?"
      gold: "confirmed data exfiltration; no customer data affected"
      qtype: "single-hop"
    assert:
